
name: Build A.T.L.A.S. APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core@6
          npm install --legacy-peer-deps --save-dev @capacitor/cli@6 @capacitor/android@6

      - name: Configure A.T.L.A.S.
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'capacitor.config.json';
          let config = {};

          if (fs.existsSync(file)) {
            config = JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          config.appId = 'com.atlas.assistant';
          config.appName = 'A.T.L.A.S.';
          if (!config.webDir) config.webDir = 'dist';

          fs.writeFileSync(file, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Add microphone permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'

          content = re.sub(
              r'\s*<uses-permission android:name="android.permission.RECORD_AUDIO"\s*/>',
              '',
              content
          )

          match = re.search(r'<manifest\b[^>]*>', content)
          if not match:
              raise SystemExit("ERROR: Manifest opening tag not found")

          content = (
              content[:match.end()]
              + "\n"
              + permission
              + content[match.end():]
          )

          manifest.write_text(content)
          print("Microphone permission inserted correctly.")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
