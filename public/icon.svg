<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#030712" />
  
  <!-- Outer Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#00f0ff" stroke-width="3" stroke-opacity="0.3" stroke-dasharray="16 8" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.6" stroke-dasharray="40 10 10 10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8" />
  
  <!-- Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="86" stroke="#00f0ff" stroke-width="4" />
  <line x1="256" y1="426" x2="256" y2="476" stroke="#00f0ff" stroke-width="4" />
  <line x1="36" y1="256" x2="86" y2="256" stroke="#00f0ff" stroke-width="4" />
  <line x1="426" y1="256" x2="476" y2="256" stroke="#00f0ff" stroke-width="4" />

  <!-- Center Glowing Core -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="35" fill="#ffffff" opacity="0.9" filter="url(#glow)" />
  
  <!-- Tactical Text -->
  <text x="256" y="380" font-family="'Orbitron', sans-serif" font-weight="900" font-size="28" fill="#00f0ff" text-anchor="middle" letter-spacing="8">A.T.L.A.S.</text>
</svg>
